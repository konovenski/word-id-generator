<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word ID Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 1.5rem;
        }
        #idDisplay {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            padding: 1rem;
            background: #f7f7f7;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }
        button {
            background: #333;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Word ID Generator</h1>
        <div id="idDisplay"></div>
        <button onclick="generateNewId()">Generate New ID</button>
    </div>
    <script src="word-id-generator.js"></script>
    <script>
        function generateNewId() {
            document.getElementById('idDisplay').textContent = wordIdGenerator();
        }
        generateNewId();
    </script>
</body>
</html>
